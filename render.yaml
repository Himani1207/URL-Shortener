# Render Blueprint — API only.
#
# Create this stack with Render → New → Blueprint, pointed at this repository.
#
# The frontend deploys to Vercel from frontend/vercel.json.
# The database is Neon, which lives outside Render entirely — hence no
# `databases:` block here. Render's own free PostgreSQL is deleted after 30
# days; Neon's free tier is not, which is the reason for the split.
#
# ---------------------------------------------------------------------------
# Values you must fill in yourself
# ---------------------------------------------------------------------------
# Everything marked `sync: false` is left blank on purpose — Render prompts for
# it on first deploy and stores it encrypted. Nothing secret belongs in this
# file, which is committed.
#
#   SPRING_DATASOURCE_URL       see the conversion note below
#   SPRING_DATASOURCE_USERNAME  the Neon role, e.g. neondb_owner
#   SPRING_DATASOURCE_PASSWORD  the Neon password
#   JWT_SECRET                  openssl rand -base64 64
#   APP_BASE_URL                https://<your-api>.onrender.com
#   FRONTEND_URL                https://<your-app>.vercel.app
#   CORS_ALLOWED_ORIGINS        https://<your-app>.vercel.app
#
# The last three are chicken-and-egg: the service's own URL does not exist
# until it has deployed once. Deploy, copy the assigned address, set them,
# redeploy.
#
# ---------------------------------------------------------------------------
# Converting the Neon connection string for Java
# ---------------------------------------------------------------------------
# Neon hands you a libpq URL. It cannot be pasted into a JDBC setting as-is:
#
#   postgresql://USER:PASSWORD@HOST/neondb?sslmode=require&channel_binding=require
#
# becomes
#
#   jdbc:postgresql://HOST/neondb?sslmode=require
#
# Three changes:
#   * `jdbc:` prefix — without it the driver is never selected.
#   * Credentials move out of the URL into their own settings, so the password
#     stays out of anything that logs a connection string.
#   * `channel_binding` is dropped. It is a libpq option with no JDBC
#     equivalent; the driver ignores it, so it is silently misleading rather
#     than harmful. `sslmode=require` is real and must stay.
#
# Use the `-pooler` host. It is PgBouncer in transaction mode, which normally
# breaks server-side prepared statements — but Neon's version negotiates them
# at protocol level, so Hibernate works without `prepareThreshold=0`. This was
# checked against the live database rather than assumed.

services:
  - type: web
    name: linkly-api
    runtime: docker
    plan: free
    region: oregon

    # The Dockerfile copies pom.xml and src/ relative to its own directory, so
    # the build context is backend/, not the repo root.
    rootDir: backend
    dockerfilePath: ./Dockerfile

    # Render restarts the service if this stops returning 200.
    healthCheckPath: /actuator/health

    envVars:
      # --- Database: Neon. Set all three on the dashboard. -------------------
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # --- Schema -----------------------------------------------------------
      # `update` lets Hibernate create the schema on first boot, which is why a
      # fresh Neon database needs no migration step. It never drops or narrows
      # a column, so it cannot destroy data — but it cannot perform a real
      # migration either. Move to Flyway before this holds anything you would
      # mind losing.
      - key: JPA_DDL_AUTO
        value: update
      - key: JPA_SHOW_SQL
        value: "false"

      # Neon sleeps when idle and takes a few seconds to wake. The default
      # Hikari timeout of 30s absorbs that comfortably; a shorter one would
      # turn the first request after a quiet spell into a failure.
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_POOL_MIN
        value: "1"

      # --- Caching ----------------------------------------------------------
      # No Redis on the free tier. `simple` is an in-memory ConcurrentMap:
      # correct, but per-instance and empty after every restart. The Redis
      # health indicator must be off to match — it feeds /actuator/health, so
      # leaving it on would fail the health check on a dependency that is not
      # there and Render would restart a healthy container.
      # To add Redis later: create a Key Value service, then set
      # CACHE_TYPE=redis, HEALTH_REDIS_ENABLED=true, REDIS_HOST, REDIS_PORT.
      - key: CACHE_TYPE
        value: simple
      - key: HEALTH_REDIS_ENABLED
        value: "false"

      # --- Logging ----------------------------------------------------------
      - key: LOG_LEVEL_APP
        value: INFO
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # --- Fill these in on the dashboard -----------------------------------
      - key: JWT_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
